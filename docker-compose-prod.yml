  #     POSTGRES_DB: expense_tracker
  #     POSTGRES_USER: tracker
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: always

volumes:
  config:
  data:
