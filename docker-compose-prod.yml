version: '3.8'

services:
  # Aplicación principal - sincronización con cron
  expense-tracker:
    build: .
    container_name: bac-expense-tracker-prod

    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    environment:
      - PYTHONUNBUFFERED=1
      - CONFIG_DIR=/app/config
      - DATA_DIR=/app/data
      - TZ=America/El_Salvador
      - SYNC_HOUR=7          # Ejecutar a las 7 AM
      - SYNC_MINUTE=0        # En el minuto 0

    restart: always

    # Límite de recursos
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    # Health check
    healthcheck:
      test: ["CMD", "test", "-f", "/app/data/expenses.json"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Ejecutar en daemon (cada hora)
    command: daemon

  # Dashboard web
  dashboard:
    image: nginx:alpine
    container_name: bac-dashboard-prod

    ports:
      - "8080:80"

    volumes:
      - ./dashboard.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data:/usr/share/nginx/html/data:ro

    environment:
      - TZ=America/El_Salvador

    restart: always

    depends_on:
      - expense-tracker

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Límite de recursos
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M

  # PostgreSQL para histórico (opcional)
  # db:
  #   image: postgres:15-alpine
