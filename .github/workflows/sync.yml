name: Sync Gmail Expenses

on:
  schedule:
    - cron: "0 13 * * *" # 07:00 America/El_Salvador (UTC-6)
  workflow_dispatch:
    inputs:
      since:
        description: "Fecha inicial YYYY-MM-DD (opcional, sobreescribe SYNC_DAYS)"
        required: false
        type: string
      until:
        description: "Fecha final YYYY-MM-DD (opcional)"
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir credenciales de Gmail
        run: |
          mkdir -p config
          echo "${{ secrets.GMAIL_CREDENTIALS_B64 }}" | base64 -d > config/credentials.json
          echo "${{ secrets.GMAIL_TOKEN_B64 }}" | base64 -d > config/token.json

      - name: Sincronizar gastos
        env:
          CONFIG_DIR: config
          DATA_DIR: data
          BANK_EMAIL: ${{ vars.BANK_EMAIL }}
          BANK: ${{ vars.BANK }}
          SYNC_DAYS: ${{ vars.SYNC_DAYS }}
          SYNC_SINCE: ${{ github.event.inputs.since }}
          SYNC_UNTIL: ${{ github.event.inputs.until }}
          CARD_TYPE_MAP: ${{ vars.CARD_TYPE_MAP }}
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
        run: python gmail_reader.py

      - name: Eliminar credenciales temporales
        if: always()
        run: rm -rf config

      - name: Commit y push si hay cambios
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/expenses.enc.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync expenses $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Un push hecho con GITHUB_TOKEN no dispara otros workflows automáticamente,
      # así que disparamos el deploy de Pages explícitamente.
      - name: Disparar despliegue de Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml
