name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "dashboard.html"
      - "data/expenses.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Preparar sitio estático
        run: |
          mkdir -p _site/data
          cp dashboard.html _site/index.html
          cp data/expenses.json _site/data/expenses.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
